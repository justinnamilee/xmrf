name: Windows Perl tests

on:
  workflow_dispatch:
  push:
    tags:
    - "wintest-*"

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Perl...
        shell: powershell
        run: |
          choco install strawberryperl -y
          echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\Strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Get dependencies...
        run: |
          cpanm -n -q Test2::V1 Capture::Tiny

      - name: Test...
        run: prove -lv t

      - name: Build Windows executable...
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist
          pp -I lib -o dist/xmrf.exe bin/xmrf

          Get-Item .\dist\xmrf.exe | Format-List Name, Length, FullName
          Get-Command .\dist\xmrf.exe

      - name: Smoke test packaged executable...
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          $smoke = Join-Path $env:RUNNER_TEMP "xmrf-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item .\dist\xmrf.exe $smoke

          Set-Location $smoke

          .\xmrf.exe ".*" "testing" >stdout.txt 2>stderr.txt
          $rc = $LASTEXITCODE

          Write-Host "exit=$rc"
          Write-Host "exe bytes=$((Get-Item .\xmrf.exe).Length)"
          Write-Host "stdout bytes=$((Get-Item stdout.txt).Length)"
          Write-Host "stderr bytes=$((Get-Item stderr.txt).Length)"

          Get-Content stderr.txt -TotalCount 5
          Get-Content stdout.txt -TotalCount 5

          exit $rc

      - name: Upload Windows executable...
        uses: actions/upload-artifact@v4
        with:
          name: xmrf-windows
          path: dist/xmrf.exe
