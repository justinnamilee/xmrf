name: Publish Repositories

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/scripts/**'
      - 'public/install/**'
      - 'public/pages/**'
      - 'packaging/REPOSITORIES.md'

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

# Verified multi-platform manifest digests; package managers still receive
# signed updates from their official repositories inside these images.
env:
  ALPINE_IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  ARCH_IMAGE: archlinux:base@sha256:ece6c971fec3c532fd508bce299a446deaf469feecbfe7c353e995bc1a5e7bba
  DEBIAN_IMAGE: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
  FEDORA_IMAGE: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Check download selection and shell scripts
      run: |
        prove -v .github/scripts/tests/*.t
        bash -n .github/scripts/build-repositories.sh .github/scripts/run-repository-test.sh
        sh -n public/install/install.sh
        sh -n .github/scripts/test-repository.sh
        shellcheck public/install/install.sh .github/scripts/build-repositories.sh \
          .github/scripts/run-repository-test.sh .github/scripts/test-repository.sh

  build:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Preserve access to signing secrets if they live in the existing environment.
    environment: github-pages
    outputs:
      deployment_id: ${{ steps.assets.outputs.deployment_id }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Install repository tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg openssl dpkg-dev apt-utils rpm createrepo-c
    - name: Download recent stable packages
      env:
        GH_TOKEN: ${{ github.token }}
        REPO_SIZE: ${{ vars.REPO_SIZE }}
      run: perl .github/scripts/repository-assets.pl site
    - name: Sign packages and repository indexes
      env:
        GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
      run: bash .github/scripts/build-repositories.sh site
    - name: Install public assets
      id: assets
      run: |
        cp public/install/install.sh site/install.sh
        for manager in apt dnf apk pacman; do
          cp public/install/install.sh "site/install-$manager.sh"
        done
        cp public/pages/index.html site/index.html
        touch site/.nojekyll
        deployment_id="$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
        printf '%s\n' "$deployment_id" > site/build-id.txt
        printf 'deployment_id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
    - name: Archive signed site
      run: |
        # Avoid composite actions with nested action references. Pages expects
        # one artifact.tar; dereference repo links and preserve .nojekyll.
        tar --dereference --hard-dereference --directory site \
          --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
    - name: Upload Pages artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: github-pages
        path: ${{ runner.temp }}/artifact.tar
        retention-days: 3
        if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        manager: [apt, dnf, apk, pacman]
    name: Verify signed ${{ matrix.manager }} repository
    steps:
    - name: Checkout tests
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Download signed site
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: github-pages
        path: artifact
    - name: Prepare authentic and tampered mirrors
      run: |
        mkdir site
        tar -xf artifact/artifact.tar -C site
        perl .github/scripts/repository-fixtures.pl site bad-site
    - name: Verify installation and reject unauthenticated metadata
      env:
        PACKAGE_MANAGER: ${{ matrix.manager }}
      run: bash .github/scripts/run-repository-test.sh "$PACKAGE_MANAGER" local

  deploy:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Deploy verified artifact
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        manager: [apt, dnf, apk, pacman]
    name: Test deployed ${{ matrix.manager }} installer
    steps:
    - name: Checkout tests
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Wait for deployment and install from HTTPS
      env:
        PACKAGE_MANAGER: ${{ matrix.manager }}
        XMRF_REPO_URL: ${{ needs.deploy.outputs.page_url }}
        DEPLOYMENT_ID: ${{ needs.build.outputs.deployment_id }}
      run: |
        export XMRF_REPO_URL="${XMRF_REPO_URL%/}"
        bash .github/scripts/run-repository-test.sh "$PACKAGE_MANAGER" live
