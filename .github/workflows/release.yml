name: Release Builder

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/**'
      - 'packaging/**'
      - 'nfpm.yaml'
      - 'bin/**'
      - 'lib/**'
      - 't/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout...
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cpanminus
        sudo cpanm --notest --quiet Test2::V1 Capture::Tiny
    - name: Test source...
      run: prove -lv t

  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    needs:
    - test-source

    steps:
    - name: Checkout...
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Ensure Perl...
      run: |
        choco install strawberryperl -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "Strawberry Perl installation failed" }
        echo 'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
        echo 'C:\Strawberry\perl\site\bin' >> $env:GITHUB_PATH
        echo 'C:\Strawberry\c\bin' >> $env:GITHUB_PATH

    - name: Get dependencies...
      run: |
        cpanm --notest --quiet Test2::V1 Capture::Tiny PAR::Packer
        if ($LASTEXITCODE -ne 0) { throw "CPAN dependency installation failed" }

    - name: Test Strawberry...
      run: |
        prove -lv t
        if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }

    - name: Build...
      run: |
        New-Item -ItemType Directory -Force dist
        perl .github/scripts/build-exe.pl
        if ($LASTEXITCODE -ne 0) { throw "EXE staging failed" }
        pp -I dist/lib -M Pod::Text -a 'dist/xmrf.pod;xmrf.pod' -o dist/xmrf.exe dist/bin/xmrf
        if ($LASTEXITCODE -ne 0) { throw "PAR packing failed" }
        Get-Item .\dist\xmrf.exe | Format-List Name, Length, FullName
        Get-Command .\dist\xmrf.exe

    - name: Upload...
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: exe
        path: dist/xmrf.exe
        if-no-files-found: error

  build-packages:
    runs-on: ubuntu-latest
    needs: test-source
    timeout-minutes: 20
    steps:
    - name: Checkout...
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Set up Go...
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.27.3'
        cache: false
    - name: Install packager...
      # Exact module version; Go verifies downloads using the checksum database.
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
    - name: Build cool packages...
      shell: bash
      run: |
        version=$(perl -Ilib -Mxmrf::app -e 'print $xmrf::app::VERSION')
        if [[ $GITHUB_REF_TYPE == tag ]]; then version=$GITHUB_REF_NAME; fi
        bash .github/scripts/build-cool.sh "$version"
    - name: Upload cool packages...
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-packages
        path: dist/*
        if-no-files-found: error

  test-packages:
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - {format: deb, image: 'debian:12'}
        - {format: deb, image: 'debian:13'}
        - {format: deb, image: 'ubuntu:22.04'}
        - {format: deb, image: 'ubuntu:24.04'}
        - {format: deb, image: 'ubuntu:26.04'}
        - {format: rpm, image: 'fedora:43'}
        - {format: rpm, image: 'fedora:44'}
        - {format: rpm, image: 'rockylinux:9'}
        - {format: rpm, image: 'rockylinux/rockylinux:10'}
        - {format: apk, image: 'alpine:3.22'}
        - {format: apk, image: 'alpine:3.23'}
        - {format: apk, image: 'alpine:3.24'}
        - {format: archlinux, image: 'archlinux:base'}
    name: Test ${{ matrix.format }} on ${{ matrix.image }}
    steps:
    - name: Checkout...
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Download cool packages...
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: linux-packages
        path: packages
    - name: Action...
      env:
        TEST_IMAGE: ${{ matrix.image }}
        PACKAGE_FORMAT: ${{ matrix.format }}
      run: |
        docker run --rm \
          -v "$PWD/packages:/packages:ro" \
          -v "$PWD/.github/scripts/test-package.sh:/test-package.sh:ro" \
          "$TEST_IMAGE" sh /test-package.sh "$PACKAGE_FORMAT"

  test-exe:
    needs: build-exe
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - name: Download EXE
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: exe
        path: pkg
    - name: Test portable EXE
      shell: pwsh
      run: |
        $exe = (Resolve-Path .\pkg\xmrf.exe).Path
        # Isolate the packed executable from any runner-installed Perl.
        $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
        Remove-Item Env:PERL5LIB, Env:PERLLIB, Env:XMRF_LIB -ErrorAction SilentlyContinue
        & $exe --help
        if ($LASTEXITCODE -ne 0) { throw "EXE help failed" }
        # Existing xmrf --version prints a version and exits 1.
        $version = & $exe --version 2>&1
        if ($LASTEXITCODE -ne 1 -or ($version -join "`n") -notmatch 'Version: v[0-9]') {
          throw "EXE version failed"
        }
        $work = Join-Path $env:RUNNER_TEMP 'xmrf-smoke'
        New-Item -ItemType Directory -Force $work | Out-Null
        Set-Content (Join-Path $work 'example-001.txt') 'package smoke test'
        & $exe -i $work '^example-([0-9]+)$' 'renamed-%s'
        if ($LASTEXITCODE -ne 0) { throw "EXE dry run failed" }
        if (!(Test-Path (Join-Path $work 'example-001.txt'))) { throw "Dry run changed input" }
        if (Test-Path (Join-Path $work 'renamed-001.txt')) { throw "Dry run created output" }
        & $exe -e -i $work '^example-([0-9]+)$' 'renamed-%s'
        if ($LASTEXITCODE -ne 0) { throw "EXE rename failed" }
        if (Test-Path (Join-Path $work 'example-001.txt')) { throw "Input was not renamed" }
        if ((Get-Content (Join-Path $work 'renamed-001.txt')) -ne 'package smoke test') {
          throw "Renamed file content mismatch"
        }

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-exe, test-packages]
    permissions:
      contents: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true
    - name: Generate checksums
      working-directory: dist
      run: sha256sum -- *.deb *.rpm *.apk *.pkg.tar.zst *.exe > SHA256SUMS
    - name: Draft release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          dist/*.deb
          dist/*.rpm
          dist/*.apk
          dist/*.pkg.tar.zst
          dist/*.exe
          dist/SHA256SUMS
