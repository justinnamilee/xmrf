name: Release Builder

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  test-source:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout...
      uses: actions/checkout@v4

    - name: Get dependencies...
      run: |
        sudo apt-get update
        sudo apt-get install -y cpanminus
        sudo cpanm -n -q Test2::V1 Capture::Tiny

    - name: Test...
      run: prove -lv t

  build-exe:
    runs-on: windows-latest
    needs:
    - test-source

    steps:
    - name: Checkout...
      uses: actions/checkout@v4

    - name: Ensure Perl...
      shell: powershell
      run: |
        choco install strawberryperl -y
        echo 'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
        echo 'C:\Strawberry\c\bin' >> $env:GITHUB_PATH

    - name: Get dependencies...
      run: |
        cpanm -n -q Test2::V1 Capture::Tiny

    - name: Test Strawberry...
      run: |
        prove -lv t

    - name: Build...
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force dist

        # prep the packed EXE version of the app with perl one-line hackeries
        perl -ne 'BEGIN { open STDOUT, q[>], q[dist/xmrf.pod] or die $! } $p ||= /^__END__$/; print if $p && !/^__END__$/' bin/xmrf
        perl -i -pe 's/#\*EXE POD\*#/my\$pod=PAR::read_file(q[xmrf.pod]);open(my\$pfh,q[<],\\\$pod) or die \$!;/' lib/xmrf/app.pm
        perl -i -pe 's/-input => \$0/-input => \$pfh/' lib/xmrf/app.pm
        perl -i -pe 's/use strict;/use strict;use PAR;/' lib/xmrf/app.pm

        pp -I lib -a 'dist/xmrf.pod;xmrf.pod' -o dist/xmrf.exe bin/xmrf

        Get-Item .\dist\xmrf.exe | Format-List Name, Length, FullName
        Get-Command .\dist\xmrf.exe

    - name: Upload...
      uses: actions/upload-artifact@v4
      with:
        name: exe
        path: dist/xmrf.exe

  build-deb:
    runs-on: ubuntu-latest
    needs:
    - test-source

    steps:
    - name: Checkout...
      uses: actions/checkout@v4

    - name: Build...
      shell: bash
      run: |
        set -euo pipefail

        VERSION="$(perl -pe 's/^v//; s/-/~/' <<< "$GITHUB_REF_NAME")"
        PKG=pkg
        DEB="xmrf_${VERSION}_all.deb"

        perl -pi -e 's/^use v5.+\n//' bin/xmrf

        install -d "$PKG/DEBIAN"

        install -Dm755 bin/xmrf \
          "$PKG/usr/bin/xmrf"

        install -Dm644 lib/xmrf/app.pm \
          "$PKG/usr/share/xmrf/lib/xmrf/app.pm"

        install -d "$PKG/usr/share/man/man1"
        pod2man bin/xmrf                   \
          --center="Regex-map File Rename" \
          --section=1                      \
          --release="$GITHUB_REF_NAME"     |
          gzip -9                          \
          > "$PKG/usr/share/man/man1/xmrf.1.gz"

        install -d "$PKG/usr/share/doc/xmrf"
        cat >"$PKG/usr/share/doc/xmrf/copyright" <<'EOF'
        Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
        Upstream-Name: xmrf

        Files: *
        Copyright: 2026 Justin Lee
        License: GPL-3+
          This program is free software: you can redistribute it and/or modify
          it under the terms of the GNU General Public License as published by
          the Free Software Foundation, either version 3 of the License, or
          (at your option) any later version.
          .
          See /usr/share/common-licenses/GPL-3 for the full license text.
        EOF

        cat >"$PKG/DEBIAN/control" <<EOF
        Package: xmrf
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: all
        Maintainer: Justin Lee <justin.nami.lee@gmail.com>
        Depends: perl (>= 5.28)
        Description: XMRF
          Regex-map Rename File
        EOF

        dpkg-deb --build "$PKG" "$DEB"

    - name: Upload .deb...
      uses: actions/upload-artifact@v4
      with:
        name: deb
        path: xmrf_*.deb

  build-rpm:
    runs-on: ubuntu-latest
    needs:
    - test-source

    steps:
    - name: Fedora-ify...
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm

    - name: Checkout...
      uses: actions/checkout@v4

    - name: Build...
      shell: bash
      run: |
        set -euo pipefail

        VERSION="$(perl -pe 's/^v//; s/-/~/; s/-/./g' <<< "$GITHUB_REF_NAME")"

        perl -pi -e 's/^use v5.+\n//' bin/xmrf

        install -d rpmbuild/SPECS

        cat >rpmbuild/SPECS/xmrf.spec <<EOF
        Name:           xmrf
        Version:        ${VERSION}
        Release:        1
        Summary:        Regex-map Rename File
        License:        GPL-3.0-or-later
        BuildArch:      noarch
        Requires:       perl >= 5.28

        %description
        XMRF - Regex-map Rename File

        %global xmrf_libdir /usr/share/xmrf/lib

        %install
        install -Dm755 ${GITHUB_WORKSPACE}/bin/xmrf \
          %{buildroot}%{_bindir}/xmrf

        install -Dm644 ${GITHUB_WORKSPACE}/lib/xmrf/app.pm \
          %{buildroot}%{xmrf_libdir}/xmrf/app.pm

        install -d %{buildroot}%{_mandir}/man1
        pod2man ${GITHUB_WORKSPACE}/bin/xmrf \
          --center="Regex-map File Rename"   \
          --section=1                        \
          --release="$GITHUB_REF_NAME"       \
          > %{buildroot}%{_mandir}/man1/xmrf.1

        %files
        %{_bindir}/xmrf
        %{xmrf_libdir}/xmrf/app.pm
        %{_mandir}/man1/xmrf.1*

        %changelog
        EOF

        rpmbuild \
          --define "_topdir ${GITHUB_WORKSPACE}/rpmbuild" \
          -bb rpmbuild/SPECS/xmrf.spec

    - name: Upload RPM...
      uses: actions/upload-artifact@v4
      with:
        name: rpm
        path: rpmbuild/RPMS/noarch/*.rpm

  test-exe:
    needs:
    - build-exe
    runs-on: windows-latest

    steps:
    - name: Download .exe...
      uses: actions/download-artifact@v4
      with:
        name: exe
        path: pkg

    - name: Test .exe...
      shell: powershell
      run: |
        .\pkg\xmrf --help
        .\pkg\xmrf -r '(.*)' '%s'

        if ($LASTEXITCODE -ne 0) {
          throw "xmrf smoke test failed with exit code $rc"
        }

  test-deb:
    needs:
    - build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
        - debian:12
        - debian:13
        - ubuntu:20.04
        - ubuntu:22.04
        - ubuntu:24.04
        - ubuntu:26.04
    container: ${{ matrix.image }}

    steps:
    - name: Download .deb...
      uses: actions/download-artifact@v4
      with:
        name: deb
        path: pkg

    - name: Test .deb...
      shell: bash
      run: |
        set -euxo pipefail

        perl -ni -e 'print unless m{^\s*path-exclude=/usr/share/man/\*\s*$}' \
          /etc/dpkg/dpkg.cfg.d/excludes
        export DEBIAN_FRONTEND=noninteractive

        apt-get update
        apt-get install -y ./pkg/*.deb

        dpkg --verify xmrf
        dpkg -L xmrf | grep 'xmrf\.1'
        dpkg -L xmrf | grep 'copyright'
        dpkg -L xmrf |
          while read -r f; do test -e "$f" || exit 1; done

        xmrf -h &>/dev/null
        xmrf -r '(.*)' '%s'

  test-rpm:
    needs:
    - build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
        - fedora:38
        - fedora:40
        - fedora:42
        - fedora:44
        - rockylinux:9
        - rockylinux/rockylinux:10
    container: ${{ matrix.image }}

    steps:
    - name: Download .rpm...
      uses: actions/download-artifact@v4
      with:
        name: rpm
        path: pkg

    - name: Test .rpm...
      shell: bash
      run: |
        set -euxo pipefail

        dnf install -y ./pkg/*.rpm

        rpm -V xmrf
        rpm -ql xmrf | grep 'xmrf\.1'

        xmrf -h &>/dev/null
        xmrf -r '(.*)' '%s'

  draft-release:
    runs-on: ubuntu-latest
    needs:
    - test-exe
    - test-deb
    - test-rpm

    steps:
    - name: Download packages...
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Draft...
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          dist/*.deb
          dist/*.rpm
          dist/*.exe
